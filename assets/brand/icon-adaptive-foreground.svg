<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- Unbottl Android adaptive FOREGROUND. Curve is deeper than the iOS master
       because the launcher crops to the middle 66%, where a shallow curve reads flat.
       Unbottl app icon — "The fill".
       The tile is the glass: wine occupies the lower field, its surface dipping
       in the middle the way liquid sits against glass walls. No object drawn.
       Full-bleed and squared off — iOS applies its own mask, and the composition
       survives Android's circular crop because a horizontal fill still reads. -->
  <defs>
    <linearGradient id="wine" x1="0" y1="0.42" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7C3039"/>
      <stop offset="55%"  stop-color="#61242C"/>
      <stop offset="100%" stop-color="#45161C"/>
    </linearGradient>
    <!-- Light catching the surface, so the meniscus reads as liquid not a border. -->
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#B4666F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C07B84" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body">
      <path d="M0 43 Q50 78 100 43 V100 H0 Z"/>
    </clipPath>
  </defs>

  <path d="M0 43 Q50 78 100 43 V100 H0 Z" fill="url(#wine)"/>
  <g clip-path="url(#body)">
    <path d="M0 43 Q50 78 100 43 V54 Q50 72 0 54 Z" fill="url(#surface)"/>
  </g>
  <path d="M0 43 Q50 78 100 43" fill="none" stroke="#A85C66" stroke-width="0.8" opacity="0.7"/>
  <circle cx="71" cy="63" r="1.5" fill="#FAF8F5" opacity="0.07"/>
  <circle cx="63.5" cy="72" r="0.9" fill="#FAF8F5" opacity="0.055"/>
  <circle cx="78" cy="75" r="0.6" fill="#FAF8F5" opacity="0.05"/>
</svg>
